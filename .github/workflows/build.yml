name: Build Android DSP APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Perbaiki Semua Namespace XML Otomatis
        run: |
          find app/src/main/res -name "*.xml" -exec sed -i 's|http://android.com|http://android.com|g' {} +

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: DSP-Equalizer-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
